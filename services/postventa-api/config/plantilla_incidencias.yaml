# services/postventa-api/config/plantilla_incidencias.yaml
#
# Listas cerradas y textos de la plantilla de incidencias (F-036, design.md 3.4).
# Lo carga y valida infrastructure/documentos/plantilla_yaml.py al arrancar.
#
# SIN nombres de proveedor ni de persona: este fichero va en git.
#
# UBICACIONES (D-3). Salen de las 44 rcp.resubi distintas de la obra 0677
# medidas en T2 el 2026-09-29 (progress/explore_F-036.md). Cada entrada dice en
# `origen` de que valores medidos sale; las que no salen de ninguno llevan
# `revisar` con el motivo y las tiene que revisar el humano. Normalizar es:
# mayuscula inicial, tildes, variantes del mismo sitio unidas y abreviaturas
# desplegadas. La tabla "original -> normalizada" esta en progress/impl_F-036.md.
# Las añadidas en T25 (Baño del dormitorio N, Pasillo, Terraza) las decidió el
# humano al revisar la migración (progress/current.md).
# El orden es el del desplegable.


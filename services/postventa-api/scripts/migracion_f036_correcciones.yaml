# services/postventa-api/scripts/migracion_f036_correcciones.yaml
#
# PROPUESTA de migración del Excel actual de incidencias de la 0677
# (creacion_incidencias.xlsx, doc. docs/referencia/05_excel_creacion_incidencias.md)
# a la plantilla de F-036. design.md §10.2; la lee scripts/migrar_excel_f036.py.
# Redactada por el implementer en T24 (2026-09-30) y ajustada en T25 con las
# decisiones del humano sobre el informe progress/migracion_F-036.md. Los cambios se hacen AQUÍ y se
# regenera el informe; nunca sobre el .xlsx.
#
# SIN nombres de proveedor ni de persona: el proveedor lo pone el script (R91).
#
# Cómo se lee:
# - Una entrada por fila del original, en su orden (`origen` = fila de Excel;
#   el original no tiene cabecera). `ubicacion_original` y `texto_original`
#   son los del original, para el cotejo (R54).
# - `oficio`: nombre EXACTO de Sigrid de un oficio de la 0677 (R97; lista en
#   progress/explore_F-036.md). `urgencia` y `listado` van por código
#   (`urgente`, `seguridad`; `primero`, `segundo`), B8-4. Listado vacío (D-5).
# - `propuesto`: los campos que son juicio del implementer y no salen tal cual
#   de la muestra.
# - `# REVISAR: <motivo>` encima de una entrada: decisión dudosa, tomada con la
#   opción más conservadora. El mismo texto va en `cambios` como
#   «REVISAR: <motivo>», para que salga en el informe.
#
# Criterios aplicados (§10.2):
# - Ubicación: la de la lista cerrada de config/plantilla_incidencias.yaml. Las
#   que no tenían equivalente las decidió el humano en T25: «Baño del
#   dormitorio N», «Terraza» y «Pasillo» se añadieron a la lista; BAÑO PLANTA
#   BAJA es «Aseo»; VESTIBULO, «Vestíbulo planta baja»; y un sitio que es parte
#   de una estancia (la terraza del dormitorio 1, la ventana del patio, el patio
#   del sótano) va a esa estancia, con el sitio en el detalle.
# - Se separa una fila cuando describe dos defectos de elementos u oficios
#   distintos, o cuando el propio texto añade otro («Además…»). Varios síntomas
#   del mismo elemento («arañada y con clavos») se quedan en una fila.
# - «PELIGRO DE SEGURIDAD» → urgencia `seguridad` en todas las filas que salen
#   de esa fila; «ERROR ESTRUCTURAL» → `urgente`, con el texto en el detalle.
#   Ninguna otra urgencia se inventa.
# - Texto: el del original, con las erratas evidentes corregidas, tildes, y las
#   mayúsculas de énfasis pasadas a frase normal; se reescribe lo mínimo.
# - Oficio: el de la muestra si es exactamente el de Sigrid; «Solados y
#   alicatados» → «Solados y Alicatados» (0133). Donde la muestra no lo trae,
#   se propone solo si el texto lo dice (pintura, mampara, ventana, tapón…) o si
#   la muestra ya da oficio a un defecto igual en otra fila; si no, se deja
#   vacío y `cambios` dice los candidatos.

